# Compiles and runs the Gleam code protoc-gen-trevrpc-gleam generates from
# proto/, into src/, with test.sh.
name = "fixture"
# 0.0.0 marks the fixture unversioned, so bumper neither bumps nor tags it.
version = "0.0.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
