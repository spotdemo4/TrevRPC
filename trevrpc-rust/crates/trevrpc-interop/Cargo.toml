[package]
name = "trevrpc-interop"
version = "1.8.0"
edition = "2024"
rust-version = "1.95.0"
description = "Cross-runtime interop executable for TrevRPC"
license = "MIT"
publish = false

[lints]
workspace = true

[[bin]]
name = "trevrpc-interop-rust"
path = "src/main.rs"

[[bench]]
name = "validation"
harness = false

[dependencies]
futures-util = "0.3"
prost = "0.14.4"
# The well-known types of the generated buf.validate messages.
prost-types = "0.14.4"
quinn = "0.11.8"
tokio = { version = "1.48.0", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
# The server's warnings and errors, and the TCP listener's connection events, on stderr.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
trevrpc = { path = "../.." }
trevrpc-protovalidate = { path = "../trevrpc-protovalidate" }

[build-dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
protoc-gen-trevrpc-rust = { path = "../protoc-gen-trevrpc-rust" }
protox = "0.10.0"

[dev-dependencies]
divan = "0.1.21"
# The validation microbenchmarks time decoding into a DynamicMessage, as validation does.
prost-reflect = "0.16.5"
rcgen = "0.14"
ring = "0.17"
