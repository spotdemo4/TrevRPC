[package]
name = "trevrpc-interop"
version = "0.1.11"
edition = "2024"
rust-version = "1.95.0"
description = "Cross-runtime interop executable for TrevRPC"
license = "MIT"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[[bin]]
name = "trevrpc-interop-rust"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
prost = "0.14.4"
quinn = "0.11.8"
tokio = { version = "1.48.0", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
trevrpc = { path = "../.." }

[build-dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
protoc-gen-trevrpc-rust = { path = "../protoc-gen-trevrpc-rust" }
protox = "0.9.1"

[dev-dependencies]
rcgen = "0.14"
