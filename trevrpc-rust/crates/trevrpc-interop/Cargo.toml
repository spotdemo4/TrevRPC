[package]
name = "trevrpc-interop"
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
description = "Cross-runtime interop executable for TrevRPC"
license = "MIT"
publish = false

[lints]
workspace = true

[[bin]]
name = "trevrpc-interop-rust"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
prost = "0.14.4"
quinn = "0.11.8"
tokio = { version = "1.48.0", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
trevrpc = { path = "../.." }

[build-dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
protoc-gen-trevrpc-rust = { path = "../protoc-gen-trevrpc-rust" }
protox = "0.10.0"

[dev-dependencies]
rcgen = "0.14"
