syntax = "proto3";

package test.rules;

import "buf/validate/validate.proto";

message Request {
  string name = 1 [(buf.validate.field).string.min_len = 3];
  Inner inner = 2;

  option (buf.validate.message).cel = {
    id: "name_not_inner"
    message: "name must differ from inner.label"
    expression: "this.name != this.inner.label"
  };
}

message Inner {
  string label = 1 [(buf.validate.field).string.max_len = 4];
}

message BadRule {
  string name = 1 [(buf.validate.field).cel = {
    id: "bad"
    expression: "this +"
  }];
}

message Items {
  repeated string items = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
}
