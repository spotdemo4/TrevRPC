[package]
name = "trevrpc-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Safe asynchronous Rust bindings for the TrevRPC native Transport ABI"
repository = "https://trev.zip/llc/TrevRPC"
license = "MIT"

[features]
default = []
native-c = ["dep:trevrpc-c-sys"]
system-native = ["native-c", "trevrpc-c-sys/system-native"]
testing = ["native-c", "trevrpc-c-sys/testing"]

[dependencies]
futures-util = "0.3"
libc = "0.2"
trevrpc-c-sys = { path = "../trevrpc-c-sys", optional = true }
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.clippy]
pedantic = "warn"
