[package]
name = "trevrpc-bench-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[dependencies]
prost = "0.14.4"
quinn = "0.11.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.48.0", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
trevrpc = { path = "../..", default-features = false, features = ["client", "server", "quinn"] }

[build-dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
protoc-gen-trevrpc-rust = { path = "../protoc-gen-trevrpc-rust" }
protox = "0.9.1"

[dev-dependencies]
rcgen = "0.14"

[[bin]]
name = "trevrpc-bench-peer-rust"
path = "src/main.rs"
