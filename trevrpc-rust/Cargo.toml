[package]
name = "trevrpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Protobuf over QUIC & WebTransport"
readme = "../README.md"
repository = "https://trev.zip/llc/TrevRPC"
license-file = "../LICENSE"

[workspace]
members = ["crates/protoc-gen-trevrpc-rust"]
resolver = "3"

[lints.clippy]
pedantic = "warn"

[lib]
path = "src/lib.rs"

[features]
default = ["client", "server", "quinn", "webtransport"]
client = ["dep:tokio"]
server = ["dep:tokio"]
quinn = ["client", "server", "dep:quinn", "dep:tokio"]
tracing = ["dep:tracing"]
webtransport = ["quinn", "client", "server", "dep:tokio", "dep:web-transport-quinn"]

[dependencies]
async-trait = "0.1.89"
prost = "0.14.4"
quinn = { version = "0.11.8", optional = true }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }
web-transport-quinn = { version = "0.11.9", optional = true, default-features = false, features = [
  "ring",
] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
rcgen = "0.14"
time = "0.3"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
url = "2"

[[bench]]
name = "rpc_comparison"
harness = false
