[package]
name = "trevrpc"
version = "1.3.2"
edition = "2024"
rust-version = "1.95.0"
description = "Protobuf over QUIC, HTTP/3 & WebTransport"
readme = "README.md"
repository = "https://trev.zip/llc/TrevRPC"
license = "MIT"
license-file = "../LICENSE"
keywords = ["quic", "rpc", "protobuf", "webtransport", "http3"]
categories = ["network-programming"]

[workspace]
members = [
  "crates/protoc-gen-trevrpc-rust",
  "crates/trevrpc-interop",
  "crates/trevrpc-opentelemetry",
]
resolver = "3"

[workspace.lints.clippy]
# erm, actually
pedantic = { level = "warn", priority = -1 }
# performance lints from the nursery group
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
set_contains_or_insert = "warn"
clear_with_drain = "warn"
iter_with_drain = "warn"
# hold locks no longer than needed
significant_drop_tightening = "warn"
significant_drop_in_scrutinee = "warn"
# deny panics
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "greeter_server"
required-features = ["dev-certificate"]

[[bench]]
name = "frames"
harness = false

[[bench]]
name = "loopback"
harness = false

[features]
default = ["webpki-roots"]
# DevelopmentCertificate, a rotating self-signed certificate for local development.
dev-certificate = ["dep:rcgen", "dep:time"]
# The Mozilla roots that Channel::builder verifies servers with by default.
webpki-roots = ["dep:webpki-roots"]

[dependencies]
async-trait = "0.1.89"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
h2 = "0.4"
h3 = { package = "trev-h3", version = "0.2.1" }
h3-quinn = { package = "trev-h3-quinn", version = "0.2.1", features = ["datagram"] }
h3-webtransport = { package = "trev-h3-webtransport", version = "0.2.1" }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14.4"
qmux = { version = "=0.6.6", default-features = false, features = ["tcp", "ws"] }
quinn = "0.11.8"
# The congestion controller trait's RTT estimate, which quinn does not re-export.
quinn-proto = { version = "0.11.19", default-features = false }
# The development certificate, behind the "dev-certificate" feature.
rcgen = { version = "0.14", optional = true, default-features = false, features = [
  "crypto",
  "pem",
  "ring",
] }
ring = "0.17"
# The development certificate's validity, from SystemTime (rcgen leaves out time's "std").
time = { version = "0.3", optional = true }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tower-service = "0.3"
tracing = "0.1.44"
web-transport-trait = "0.5"
# Channel::builder's default roots, behind the "webpki-roots" feature.
webpki-roots = { version = "1", optional = true }
# libzstd, for compressed messages. No legacy-format decoders; "experimental" has the magicless
# frame format.
zstd-safe = { version = "8.2", default-features = false, features = ["std", "experimental"] }

[dev-dependencies]
divan = "0.1.21"
rcgen = "0.14"
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "test-util",
] }
# The current span in tests of interceptor spans.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# Test-only WebTransport client; the library itself ships no WebTransport or HTTP/3 client.
url = "2"
web-transport-quinn = { version = "0.13.0", default-features = false, features = ["ring"] }
