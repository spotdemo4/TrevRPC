[package]
name = "trevrpc"
version = "1.10.0"
edition = "2024"
rust-version = "1.95.0"
description = "Protobuf over QUIC, HTTP/3 & WebTransport"
readme = "README.md"
repository = "https://trev.zip/llc/TrevRPC"
license = "MIT"
license-file = "../LICENSE"
keywords = ["quic", "rpc", "protobuf", "webtransport", "http3"]
categories = ["network-programming"]

[workspace]
members = [
  "crates/protoc-gen-trevrpc-rust",
  "crates/trevrpc-interop",
  "crates/trevrpc-opentelemetry",
  "crates/trevrpc-protovalidate",
]
resolver = "3"

