[package]
name = "trevrpc"
version = "0.1.11"
edition = "2024"
rust-version = "1.95.0"
description = "Protobuf over QUIC, HTTP/3 & WebTransport"
readme = "README.md"
repository = "https://trev.zip/llc/TrevRPC"
license = "MIT"
keywords = ["quic", "rpc", "protobuf", "webtransport", "http3"]
categories = ["network-programming"]

[workspace]
members = [
  "crates/protoc-gen-trevrpc-rust",
  "crates/trevrpc-bench-peer",
  "crates/trevrpc-c-sys",
  "crates/trevrpc-native",
  "crates/trevrpc-conformance-rust",
]
resolver = "3"

[lints.clippy]
pedantic = "warn"

[lib]
path = "src/lib.rs"

[features]
default = ["client", "server", "quinn", "http3", "webtransport"]
client = ["dep:tokio"]
server = ["dep:tokio"]
quinn = ["client", "server", "dep:quinn", "dep:tokio"]
http3 = ["quinn", "server", "dep:h3", "dep:h3-quinn", "dep:http"]
tracing = ["dep:tracing"]
webtransport = ["webtransport-client", "webtransport-server"]
webtransport-client = ["quinn", "dep:web-transport-quinn", "dep:url"]
webtransport-server = ["http3", "dep:h3-webtransport", "h3-quinn/datagram"]
native-c = ["client", "server", "dep:http", "dep:trevrpc-native", "trevrpc-native/native-c"]
system-native = ["native-c", "trevrpc-native/system-native"]
testing = ["native-c", "trevrpc-native/testing"]

[dependencies]
async-trait = "0.1.89"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
h3-webtransport = { version = "0.1.2", optional = true }
http = { version = "1", optional = true }
prost = "0.14.4"
quinn = { version = "0.11.8", optional = true }
trevrpc-native = { path = "crates/trevrpc-native", optional = true, default-features = false }
tokio = { version = "1.48.0", features = [
  "io-util",
  "macros",
  "rt",
  "sync",
  "time",
], optional = true }
tracing = { version = "0.1.44", optional = true }
web-transport-quinn = { version = "0.12.0", optional = true, default-features = false, features = [
  "ring",
] }
url = { version = "2", optional = true }

[dev-dependencies]
quinn = { version = "0.11.11", features = ["qlog"] }
rcgen = "0.14"
time = "0.3"
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "test-util",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber = "0.3"
