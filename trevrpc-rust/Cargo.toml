[package]
name = "trevrpc"
version = "1.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Protobuf over QUIC, HTTP/3 & WebTransport"
readme = "README.md"
repository = "https://trev.zip/llc/TrevRPC"
license = "MIT"
license-file = "../LICENSE"
keywords = ["quic", "rpc", "protobuf", "webtransport", "http3"]
categories = ["network-programming"]

[workspace]
members = ["crates/protoc-gen-trevrpc-rust", "crates/trevrpc-interop"]
resolver = "3"

[workspace.lints.clippy]
# erm, actually
pedantic = { level = "warn", priority = -1 }
# developing lints
nursery = { level = "warn", priority = -1 }
# deny panics
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bench]]
name = "frames"
harness = false

[[bench]]
name = "loopback"
harness = false

[dependencies]
async-trait = "0.1.89"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
h2 = "0.4"
h3 = { package = "trev-h3", version = "0.2.1" }
h3-quinn = { package = "trev-h3-quinn", version = "0.2.1", features = ["datagram"] }
h3-webtransport = { package = "trev-h3-webtransport", version = "0.2.1" }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14.4"
qmux = { version = "=0.6.6", default-features = false, features = ["tcp", "ws"] }
quinn = "0.11.8"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tower-service = "0.3"
tracing = "0.1.44"
web-transport-trait = "0.5"

[dev-dependencies]
divan = "0.1.21"
rcgen = "0.14"
time = "0.3"
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "test-util",
] }
# Test-only WebTransport client; the library itself ships no WebTransport or HTTP/3 client.
url = "2"
web-transport-quinn = { version = "0.13.0", default-features = false, features = ["ring"] }
