[package]
name = "trevrpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Protobuf over QUIC & WebTransport"
readme = "../README.md"
repository = "https://trev.zip/llc/TrevRPC"
license-file = "../LICENSE"

[workspace]
members = ["crates/protoc-gen-trevrpc-rust"]
resolver = "3"

[lints.clippy]
pedantic = "warn"

[lib]
path = "src/lib.rs"

[[bin]]
name = "trevrpc"
path = "main.rs"

[features]
default = ["client", "server", "quinn"]
client = ["dep:tokio"]
server = ["dep:tokio"]
quinn = ["client", "server", "dep:quinn", "dep:tokio"]
tracing = ["dep:tracing"]

[dependencies]
async-trait = "0.1.89"
prost = "0.14.4"
quinn = { version = "0.11.8", optional = true }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
