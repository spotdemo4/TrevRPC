[package]
name = "trevrpc"
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
description = "Protobuf over QUIC, HTTP/3 & WebTransport"
readme = "README.md"
repository = "https://trev.zip/llc/TrevRPC"
license = "MIT"
keywords = ["quic", "rpc", "protobuf", "webtransport", "http3"]
categories = ["network-programming"]

[workspace]
members = ["crates/protoc-gen-trevrpc-rust", "crates/trevrpc-interop"]
resolver = "3"

[lints.clippy]
pedantic = "warn"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
http = "1"
prost = "0.14.4"
quinn = "0.11.8"
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = "0.14"
time = "0.3"
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "test-util",
] }
# Test-only WebTransport client; the library itself ships no WebTransport or HTTP/3 client.
url = "2"
web-transport-quinn = { version = "0.13.0", default-features = false, features = ["ring"] }
