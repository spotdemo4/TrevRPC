[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["trevrpc-kotlin/interop-android", "trevrpc-kotlin/scripts"]
executionEnvironments = [{ root = "trevrpc-kotlin/interop-android" }]
pythonVersion = "3.14"
typeCheckingMode = "strict"

