name: smoke

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.matrix.outputs.android }}
      linux: ${{ steps.matrix.outputs.linux }}
      webkit: ${{ steps.matrix.outputs.webkit }}
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0

      - name: Discover smoke cells
        id: matrix
        run: |
          jq --null-input --raw-output \
            --slurpfile native bench/campaigns/native-smoke.example.json \
            --slurpfile chromium bench/campaigns/chromium-smoke.example.json \
            --slurpfile firefox bench/campaigns/firefox-smoke.example.json \
            --slurpfile webkit bench/campaigns/webkit-smoke.example.json \
            '[
              "linux=" + ({include: (
                ($native[0].cells | map({
                  cell: .id,
                  campaign: "bench/campaigns/native-smoke.example.json",
                  client_package: ("trevrpc-" + .client),
                  server_package: ("trevrpc-" + .server)
                })) +
                ($chromium[0].cells | map({
                  cell: .id,
                  campaign: "bench/campaigns/chromium-smoke.example.json",
                  client_package: "trevrpc-browser-bench-peer",
                  server_package: ("trevrpc-" + .server)
                })) +
                ($firefox[0].cells | map({
                  cell: .id,
                  campaign: "bench/campaigns/firefox-smoke.example.json",
                  client_package: "trevrpc-browser-bench-peer",
                  server_package: ("trevrpc-" + .server)
                }))
              )} | tojson),
              "webkit=" + ({include: ($webkit[0].cells | map({
                cell: .id,
                campaign: "bench/campaigns/webkit-smoke.example.json",
                client_package: "trevrpc-browser-bench-peer",
                server_package: ("trevrpc-" + .server)
              }))} | tojson),
              "android=" + ({include: ($native[0].peers | map({
                server: .id,
                server_command: .command[0],
                server_package: ("trevrpc-" + .id)
              }))} | tojson)
            ] | .[]' >> "$GITHUB_OUTPUT"

  prepare:
    name: prepare-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0

      - name: Build benchmark suite
        run: nix build .#trevrpc-bench-suite --no-link

  prepare-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0

      - name: Build Android smoke harness
        run: nix build .#trevrpc-kotlin.benchPeerCronet --no-link

  smoke-linux:
    name: smoke-${{ matrix.cell }}
    needs: [discover, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.discover.outputs.linux) }}
    env:
      CAMPAIGN: ${{ matrix.campaign }}
      CELL: ${{ matrix.cell }}
      CLIENT_PACKAGE: ${{ matrix.client_package }}
      SERVER_PACKAGE: ${{ matrix.server_package }}
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0

      - name: Run smoke cell
        run: |
          nix shell \
            .#trevrpc-bench \
            ".#$CLIENT_PACKAGE" \
            ".#$SERVER_PACKAGE" \
            --command ./bench/ci/run-smoke-cell.sh \
              "$CAMPAIGN" \
              "$CELL" \
              "$RUNNER_TEMP/smoke"

  smoke-android:
    name: smoke-kotlin-cronet-to-${{ matrix.server }}
    needs: [discover, prepare, prepare-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.android) }}
    env:
      SERVER: ${{ matrix.server }}
      SERVER_COMMAND: ${{ matrix.server_command }}
      SERVER_PACKAGE: ${{ matrix.server_package }}
      WORK_DIR: /nix/trevrpc-android/work
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0

      - name: Prepare Android work directory
        run: sudo install -d -o "$USER" -g "$(id -gn)" "$WORK_DIR"

      - name: Allow KVM access
        run: sudo chown "$USER" /dev/kvm

      - name: Run Android smoke cell
        env:
          OUTPUT: ${{ runner.temp }}/smoke-kotlin-cronet-to-${{ matrix.server }}
        run: |
          nix shell \
            .#trevrpc-kotlin.benchPeerCronet \
            ".#$SERVER_PACKAGE" \
            --command trevrpc-bench-peer-kotlin-cronet \
              --server-id "$SERVER" \
              --server-command "$SERVER_COMMAND" \
              --output "$OUTPUT" \
              --work-dir "$WORK_DIR"

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-kotlin-cronet-to-${{ matrix.server }}
          path: ${{ runner.temp }}/smoke-kotlin-cronet-to-${{ matrix.server }}
          if-no-files-found: ignore

      - name: Clean Android work directory
        if: ${{ always() }}
        run: |
          [[ $WORK_DIR == /nix/trevrpc-android/work ]]
          sudo rm -rf -- "$WORK_DIR"

  smoke-webkit:
    name: smoke-${{ matrix.cell }}
    needs: [discover, prepare]
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.webkit) }}
    env:
      CAMPAIGN: ${{ matrix.campaign }}
      CELL: ${{ matrix.cell }}
      CLIENT_PACKAGE: ${{ matrix.client_package }}
      SERVER_PACKAGE: ${{ matrix.server_package }}
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0

      - name: Run smoke cell
        run: |
          nix shell \
            .#trevrpc-bench \
            ".#$CLIENT_PACKAGE" \
            ".#$SERVER_PACKAGE" \
            --command ./bench/ci/run-smoke-cell.sh \
              "$CAMPAIGN" \
              "$CELL" \
              "$RUNNER_TEMP/smoke"

  smoke:
    needs: [smoke-android, smoke-linux, smoke-webkit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every smoke cell
        env:
          ANDROID_RESULT: ${{ needs.smoke-android.result }}
          LINUX_RESULT: ${{ needs.smoke-linux.result }}
          WEBKIT_RESULT: ${{ needs.smoke-webkit.result }}
        run: |
          [[ $ANDROID_RESULT == success ]]
          [[ $LINUX_RESULT == success ]]
          [[ $WEBKIT_RESULT == success ]]
