name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: |
            packages.x86_64-linux.trevrpc-go.x86_64-unknown-linux-musl
            packages.x86_64-linux.trevrpc-rust.x86_64-unknown-linux-musl
        run: flake-release

      - name: Verify versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag"
          test "$(jq -r .version trevrpc-js/package.json)" = "$tag"
          test "$(jq -r .version trevrpc-js/npm/native-linux-x64-gnu/package.json)" = "$tag"
          test "$(grep '^version =' trevrpc-rust/Cargo.toml | head -1 | cut -d'"' -f2)" = "$tag"
          test "$(grep 'version =' trevrpc-js/default.nix | head -1 | grep -o '[0-9.]\+')" = "$tag"
          test "$(grep 'version =' trevrpc-js/native-package.nix | head -1 | grep -o '[0-9.]\+')" = "$tag"
          test "$(grep 'version =' trevrpc-kotlin/build.gradle.kts | head -1 | grep -o '[0-9.]\+')" = "$tag"
          test "$(grep 'version =' trevrpc-kotlin/default.nix | head -1 | grep -o '[0-9.]\+')" = "$tag"

      - name: Release to crates.io
        working-directory: trevrpc-rust
        run: cargo publish --locked

      - name: Build npm stage
        run: |
          set -euo pipefail
          stage="$(nix build .#trevrpc-js-npm-stage --no-link --print-out-paths)"
          echo "stage=$stage"
          ls -lh "$stage"/*.tgz
          cat "$stage"/manifest.json
          echo "stage=$stage" >> "$GITHUB_ENV"

      - name: Release to npm
        run: |
          set -euo pipefail
          cat "${stage}/manifest.json"
          native_tgz="$(ls "${stage}"/trevrpc-trevrpc-js-native-linux-x64-gnu-*.tgz)"
          core_tgz="$(ls "${stage}"/trevrpc-trevrpc-js-*.tgz | grep -v native)"
          echo "native: $native_tgz"
          echo "core: $core_tgz"
          test -f "$native_tgz"
          test -f "$core_tgz"
          npm publish --provenance --access public "$native_tgz"
          npm publish --provenance --access public "$core_tgz"

      - name: Stage Kotlin Maven repository
        working-directory: trevrpc-kotlin
        run: ./gradlew stageMavenRepository --no-configuration-cache

      - name: Verify Kotlin staging repository
        working-directory: trevrpc-kotlin
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          python3 publication-tests/verify_staged_repository.py build/staging-repository "$tag"

      - name: Publish Kotlin to Maven Central
        working-directory: trevrpc-kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew publishToCentral --no-configuration-cache --parallel
