name: release

on:
  push:
    tags: ["v*"]

# Bumper tags every package with the same version, so one base tag releases them all; each job
# names its package tag in TAG. A shared group would cancel queued versions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go:
    name: trevrpc-go
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@b66e42aabfd321ffd40584fb31adbfc3ea9c8f11 # v1.77.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          TAG: trevrpc-go/${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-go

  js:
    name: trevrpc-js
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@b66e42aabfd321ffd40584fb31adbfc3ea9c8f11 # v1.77.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          TAG: trevrpc-js/${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-js

  kotlin:
    name: trevrpc-kotlin
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@b66e42aabfd321ffd40584fb31adbfc3ea9c8f11 # v1.77.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          TAG: trevrpc-kotlin/${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-kotlin

  rust:
    name: trevrpc-rust
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@b66e42aabfd321ffd40584fb31adbfc3ea9c8f11 # v1.77.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          TAG: trevrpc-rust/${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-rust
