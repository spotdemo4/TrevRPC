name: release

# Only the unscoped tag: flake-release releases each package to its own tag on the same commit, so
# triggering on the package tags too would release everything twice.
on:
  push:
    tags: ["v*"]

# Every bump releases the root, which is in bumper.toml's version group with the runtimes, so each
# one has a base tag; flake-release releases each runtime to its own tag, picked by its source
# directory. A shared group would cancel queued versions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go:
    name: trevrpc-go
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-go

  js:
    name: trevrpc-js
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
