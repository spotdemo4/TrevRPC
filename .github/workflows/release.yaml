  kotlin:
    name: trevrpc-kotlin
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@e282901cae32c9c45568095f851a7e56d0cbf46d # v1.78.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-kotlin

  rust:
    name: trevrpc-rust
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@e282901cae32c9c45568095f851a7e56d0cbf46d # v1.78.0
        with:
          fetch_depth: 0
