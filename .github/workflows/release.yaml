name: release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

# each package tag releases independently; a shared group would cancel queued tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: >-
      startsWith(github.ref, 'refs/tags/trevrpc-go/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-rust/v')
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0

      - name: Check
        run: nix flake check

  go:
    needs: check
    if: startsWith(github.ref, 'refs/tags/trevrpc-go/v')
    name: trevrpc-go
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-go

      - name: Seed proxy.golang.org and pkg.go.dev
        run: .forgejo/scripts/release-go-module.sh

  rust:
    needs: check
    if: startsWith(github.ref, 'refs/tags/trevrpc-rust/v')
    name: trevrpc-rust
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-rust
