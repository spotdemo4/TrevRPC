name: release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: read

jobs:
  check:
    if: >-
      startsWith(github.ref, 'refs/tags/trevrpc-c/provider/msquic/v2.') ||
      startsWith(github.ref, 'refs/tags/trevrpc-c/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-go/quic-go/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-go/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-rust/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@af9aaf53d1ae2230cb82617c563c9427a22a8c15 # v1.66.0

      - name: Check
        run: nix flake check

  github:
    if: >-
      (startsWith(github.ref, 'refs/tags/trevrpc-go/v') &&
        !startsWith(github.ref, 'refs/tags/trevrpc-go/quic-go/v')) ||
      startsWith(github.ref, 'refs/tags/trevrpc-rust/v')
    needs: check
    name: github
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@af9aaf53d1ae2230cb82617c563c9427a22a8c15 # v1.66.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release package to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package="${GITHUB_REF_NAME%%/*}"
          .forgejo/scripts/release-nix-package.sh "$package"

  pkg:
    if: >-
      startsWith(github.ref, 'refs/tags/trevrpc-c/provider/msquic/v2.') ||
      startsWith(github.ref, 'refs/tags/trevrpc-c/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-go/quic-go/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-go/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@af9aaf53d1ae2230cb82617c563c9427a22a8c15 # v1.66.0
        with:
          fetch_depth: 0

      - name: Seed proxy.golang.org and pkg.go.dev
        run: .forgejo/scripts/release-go-module.sh
