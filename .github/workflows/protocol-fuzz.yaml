name: protocol-fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  protocol-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c0437e8d7de78564b4c3a1db710f43ce407e509b # v1.59.0

      - name: Run bounded Go fuzz targets
        run: |
          nix develop -c bash -euxo pipefail -c 'cd trevrpc-go && go test ./... -run=^$ -fuzz=FuzzFrameDecodeNeverPanics -fuzztime=60s'
          nix develop -c bash -euxo pipefail -c 'cd trevrpc-go && go test ./... -run=^$ -fuzz=FuzzFrameLengthParsing -fuzztime=60s'
          nix develop -c bash -euxo pipefail -c 'cd trevrpc-go && go test ./... -run=^$ -fuzz=FuzzMetadataValidationDeterministic -fuzztime=60s'
