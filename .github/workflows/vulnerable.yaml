name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actions:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@51e2e49aaf181feb402ad2bcf9089273f5f4ad85 # v1.74.0
        with:
          shell: vulnerable

      - name: Run zizmor
        run: zizmor $(find .github/workflows -name "*.yaml")

  nix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@51e2e49aaf181feb402ad2bcf9089273f5f4ad85 # v1.74.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  go:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@51e2e49aaf181feb402ad2bcf9089273f5f4ad85 # v1.74.0
        with:
          shell: vulnerable

      - name: Run govulncheck
        working-directory: trevrpc-go
        run: govulncheck ./...

      - name: Run govulncheck on the OpenTelemetry module
        working-directory: trevrpc-go/oteltrevrpc
        run: govulncheck ./...

  kotlin:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@51e2e49aaf181feb402ad2bcf9089273f5f4ad85 # v1.74.0
        with:
          shell: vulnerable

      - name: Run OSV-Scanner
        run: .forgejo/scripts/osv-scan-kotlin.sh

  npm:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@51e2e49aaf181feb402ad2bcf9089273f5f4ad85 # v1.74.0
        with:
          shell: vulnerable

      - name: Run npm audit
        working-directory: trevrpc-js
        run: npm audit --audit-level moderate

      - name: Run npm audit on the Effect adapter
        working-directory: trevrpc-js/effect
        run: npm audit --audit-level moderate

  rust:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@51e2e49aaf181feb402ad2bcf9089273f5f4ad85 # v1.74.0
        with:
          shell: vulnerable

      - name: Run cargo audit
        working-directory: trevrpc-rust
        run: cargo-audit audit
