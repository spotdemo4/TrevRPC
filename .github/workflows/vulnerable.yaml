name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actions:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f3e848ee8e4677a689acea618a0342fa87769e53 # v1.79.0
        with:
          shell: vulnerable

      - name: Run zizmor
        run: zizmor $(find .github/workflows -name "*.yaml")

  nix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f3e848ee8e4677a689acea618a0342fa87769e53 # v1.79.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  go:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f3e848ee8e4677a689acea618a0342fa87769e53 # v1.79.0
        with:
          shell: vulnerable

      - name: Run govulncheck
        working-directory: trevrpc-go
        run: govulncheck ./...

      - name: Run govulncheck on the OpenTelemetry module
        working-directory: trevrpc-go/oteltrevrpc
        run: govulncheck ./...

      - name: Run govulncheck on the protovalidate module
        working-directory: trevrpc-go/protovalidatetrevrpc
        run: govulncheck ./...

  kotlin:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f3e848ee8e4677a689acea618a0342fa87769e53 # v1.79.0
        with:
          shell: vulnerable

      - name: Run OSV-Scanner
        run: .forgejo/scripts/osv-scan-kotlin.sh

  npm:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f3e848ee8e4677a689acea618a0342fa87769e53 # v1.79.0
        with:
          shell: vulnerable

      - name: Run npm audit
        working-directory: trevrpc-js
        run: npm audit --audit-level moderate --omit=dev

      - name: Run npm audit on the Effect adapter
        working-directory: trevrpc-js/effect
        run: npm audit --audit-level moderate --omit=dev

      - name: Run npm audit on the protovalidate adapter
        working-directory: trevrpc-js/protovalidate
        run: npm audit --audit-level moderate --omit=dev

      - name: Run npm audit on the protoc plugin
        working-directory: trevrpc-js/protoc-gen-trevrpc-js
        run: npm audit --audit-level moderate --omit=dev

  rust:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f3e848ee8e4677a689acea618a0342fa87769e53 # v1.79.0
        with:
          shell: vulnerable

      - name: Run cargo audit
        working-directory: trevrpc-rust
        run: cargo-audit audit
