name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0
        with:
          shell: vulnerable

      - name: Run cargo audit
        working-directory: trevrpc-rust
        run: cargo-audit audit

  go:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0
        with:
          shell: vulnerable

      - name: Run base module govulncheck
        working-directory: trevrpc-go
        env:
          GOWORK: "off"
        run: govulncheck ./...

      - name: Run QUIC-go module govulncheck
        working-directory: trevrpc-go/quic-go
        env:
          GOWORK: "off"
        run: govulncheck ./...

      - name: Run C module govulncheck
        working-directory: trevrpc-c
        env:
          GOWORK: "off"
        run: govulncheck ./...

      - name: Run MsQuic provider module govulncheck
        working-directory: trevrpc-c/provider/msquic
        env:
          GOWORK: "off"
        run: govulncheck ./...

  npm:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0
        with:
          shell: vulnerable

      - name: Run npm audit
        working-directory: trevrpc-js
        run: npm audit --audit-level moderate

  nix:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  actions:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c7537bc73ce11ca01e53bd9d119d6e46363f9888 # v1.65.0
        with:
          shell: vulnerable

      - name: Run zizmor
        run: zizmor .github
