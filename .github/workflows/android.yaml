name: android

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      # Loading the android shell builds the harness and both servers once, so the interop jobs
      # fetch them from the cache.
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          shell: android

  interop:
    name: android-${{ matrix.transport }}-to-${{ matrix.server }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        server: [go, rust]
        # http2 runs with QUIC disabled, as on a network that blocks UDP.
        transport: [http3, http2]
    env:
      SERVER: ${{ matrix.server }}
      TRANSPORT: ${{ matrix.transport }}
      WORK_DIR: /nix/trevrpc-android/work
      CELL: android-${{ matrix.transport }}-to-${{ matrix.server }}
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          shell: android

      - name: Prepare Android work directory
        run: sudo install -d -o "$USER" -g "$(id -gn)" "$WORK_DIR"

      - name: Allow KVM access
        run: sudo chown "$USER" /dev/kvm

      - name: Run Android interop
        env:
          OUTPUT: ${{ runner.temp }}/${{ env.CELL }}
        run: |
          trevrpc-interop-android \
            --server-command "trevrpc-interop-$SERVER server" \
            --transport "$TRANSPORT" \
            --output "$OUTPUT" \
            --work-dir "$WORK_DIR"

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.CELL }}
          path: ${{ runner.temp }}/${{ env.CELL }}
          if-no-files-found: ignore

      - name: Clean Android work directory
        if: ${{ always() }}
        run: |
          [[ $WORK_DIR == /nix/trevrpc-android/work ]]
          sudo rm -rf -- "$WORK_DIR"
