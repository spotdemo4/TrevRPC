name: safari

# Runs the browser interop suite in Safari itself, driven through safaridriver,
# on macOS. Playwright's WebKit is not used: its builds decide on their own
# whether to expose WebTransport. Every lane must pass against both servers.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      # Loading the safari shell builds the runner, both servers and the
      # browser CLI once, so the interop jobs fetch them from the cache.
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          shell: safari

  interop:
    name: safari-${{ matrix.name }}-to-${{ matrix.server }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: go
            name: webtransport
            lanes: webtransport
          - server: go
            name: websocket
            lanes: websocket,fallback
          - server: rust
            name: websocket
            lanes: websocket,fallback
          - server: rust
            name: webtransport
            lanes: webtransport
    env:
      SERVER: ${{ matrix.server }}
      LANES: ${{ matrix.lanes }}
      CELL: safari-${{ matrix.name }}-to-${{ matrix.server }}
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          shell: safari

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Run Safari interop
        env:
          OUTPUT: ${{ runner.temp }}/${{ env.CELL }}
        run: |
          trevrpc-interop \
            --out "$OUTPUT" \
            --server "$SERVER=trevrpc-interop-$SERVER" \
            --browser safari \
            --browser-lanes "$LANES"

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.CELL }}
          path: ${{ runner.temp }}/${{ env.CELL }}
          if-no-files-found: ignore
