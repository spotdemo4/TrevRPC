name: safari

# Runs the browser interop suite in Safari on macOS. The Go lane must pass. The
# Rust server's h3-webtransport does not speak the WebTransport draft Safari
# uses (hyperium/h3#347), so the Rust lane is an allowed failure: it keeps
# running so the failure stays visible, without failing the workflow.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interop:
    name: safari-to-${{ matrix.server }}
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow-failure }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: go
            allow-failure: false
          - server: rust
            allow-failure: true
    env:
      SERVER: ${{ matrix.server }}
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0

      - name: Run Safari interop
        env:
          OUTPUT: ${{ runner.temp }}/safari-to-${{ matrix.server }}
        run: |
          nix shell \
            .#trevrpc-js \
            ".#trevrpc-$SERVER" \
            .#trevrpc-interop \
            --command trevrpc-interop \
              --out "$OUTPUT" \
              --server "$SERVER=trevrpc-interop-$SERVER" \
              --browser webkit

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-to-${{ matrix.server }}
          path: ${{ runner.temp }}/safari-to-${{ matrix.server }}
          if-no-files-found: ignore
