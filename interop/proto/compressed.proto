syntax = "proto3";

package trevrpc.interop.v1;

import "interop.proto";
import "trevrpc/options.proto";

// CompressedEcho is Echo's Bidi and ClientStream with stream compression
// allowed, and Plain with compression without a dictionary (see
// interop/README.md). It is a separate file for the same reason as
// unreliable.proto: the gRPC baseline compiles only interop.proto.
service CompressedEcho {
  rpc Bidi(stream EchoRequest) returns (stream EchoResponse) {
    option (trevrpc.method) = {compress_stream: true};
  }
  // For the load benchmarks' client-stream scenario.
  rpc ClientStream(stream EchoRequest) returns (EchoResponse) {
    option (trevrpc.method) = {compress_stream: true};
  }
  // Echo.Unary, compressed without a dictionary where no dictionary applies:
  // for the load benchmarks' unary scenario in the modes without one.
  rpc Unary(EchoRequest) returns (EchoResponse) {
    option (trevrpc.method) = {compress: true};
  }
  // Echoes text, compressed without a dictionary where both sides allow it.
  rpc Plain(PlainMessage) returns (PlainMessage) {
    option (trevrpc.method) = {compress: true};
  }
}

// PlainMessage is not among the interop dictionary's message types, so it
// compresses without a dictionary.
message PlainMessage {
  string text = 1;
}

// RefusingEcho allows stream-compressed requests in the schema, but servers
// register it by hand without them, as a server built from an older schema
// would, so they refuse every optimistic call (see interop/README.md).
service RefusingEcho {
  rpc ClientStream(stream EchoRequest) returns (EchoResponse) {
    option (trevrpc.method) = {compress_stream: true};
  }
}
