#:schema https://www.schemastore.org/treefmt.json

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

[formatter.golangci-lint]
command = "golangci-lint"
options = ["fmt"]
includes = ["*.go"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.ktlint]
command = "ktlint"
options = ["--format"]
includes = ["*.kt", "*.kts"]

[formatter.buf]
command = "buf"
options = ["format", "--write"]
includes = ["*.proto"]
# buf parses "#" in a path as input options, and validate.proto is a vendored copy kept as published.
excludes = ["**/trailing_hash#.proto", "interop/proto/buf/validate/validate.proto"]
no-positional-arg-support = true

[formatter.erlfmt]
command = "erlfmt"
options = ["--write"]
includes = ["*.erl", "*.hrl", "*.app.src", "rebar.config"]
# Kept as protoc-gen-trevrpc-erlang generates them, which a check compares against.
excludes = ["trevrpc-erlang/interop/src/generated/*"]

[formatter.ruff]
command = "ruff"
options = ["format"]
includes = ["*.py"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--write", "--no-error-on-unmatched-pattern"]
includes = ["*.js", "*.ts", "*.html", "*.json", "*.jsonc", "*.yaml", "*.toml", "*.md"]
