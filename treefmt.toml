#:schema https://www.schemastore.org/treefmt.json

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

[formatter.golangci-lint]
command = "golangci-lint"
options = ["fmt"]
includes = ["*.go"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.ktlint]
command = "ktlint"
options = ["--format"]
includes = ["*.kt", "*.kts"]

[formatter.buf]
command = "buf"
options = ["format", "--write"]
includes = ["*.proto"]
# buf parses "#" in a path as input options
excludes = ["**/trailing_hash#.proto"]
no-positional-arg-support = true

[formatter.ruff]
command = "ruff"
options = ["format"]
includes = ["*.py"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--write"]
includes = ["*.js", "*.ts", "*.html", "*.json", "*.yaml", "*.toml", "*.md"]
