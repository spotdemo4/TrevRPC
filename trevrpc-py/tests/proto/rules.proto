syntax = "proto3";

package test.rules;

import "buf/validate/validate.proto";

message CreateUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string email = 2 [(buf.validate.field).string.email = true];
}

message User {
  string name = 1;
}

// No rules anywhere, in a recursive type.
message LookupRequest {
  string id = 1;
  Tree tree = 2;
}

message Tree {
  repeated Tree children = 1;
  map<string, Tree> named = 2;
}

// Rules only in the values of a map.
message BatchRequest {
  map<string, CreateUserRequest> users = 1;
}

// Rules only in the elements of a list, two levels down.
message NestedRequest {
  Batch batch = 1;
}

message Batch {
  repeated CreateUserRequest users = 1;
}

// A message rule.
message RangeRequest {
  option (buf.validate.message).cel = {
    id: "range"
    message: "start must not be after end"
    expression: "this.start <= this.end"
  };
  int32 start = 1;
  int32 end = 2;
}

// A oneof rule.
message ChoiceRequest {
  oneof kind {
    option (buf.validate.oneof).required = true;
    string a = 1;
    string b = 2;
  }
}

// A rule that names a field the message lacks, which protovalidate reports only when it evaluates
// the rule.
message BrokenRequest {
  option (buf.validate.message).cel = {
    id: "broken"
    expression: "this.missing == 1"
  };
  string name = 1;
}

// A rule that does not parse.
message SyntaxErrorRequest {
  string name = 1 [(buf.validate.field).cel = {
    id: "syntax"
    expression: "this +"
  }];
}

// A rule that cannot be evaluated for the empty message's default values: division by zero.
message DivisorRequest {
  int32 count = 1 [(buf.validate.field).cel = {
    id: "divides"
    message: "must be at most 100"
    expression: "100 / this > 0"
  }];
}

// A rule that compiles but fails to evaluate for some values: int() of a non-number.
message FragileRequest {
  string number = 1 [(buf.validate.field).cel = {
    id: "number"
    message: "must be positive"
    expression: "this == '' || int(this) > 0"
  }];
}
