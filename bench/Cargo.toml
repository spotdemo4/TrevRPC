[package]
name = "trevrpc-bench"
version = "0.1.4"
edition = "2024"
rust-version = "1.95.0"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
default_trait_access = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"

[dependencies]
base16ct = { version = "1.0.0", features = ["alloc"] }
libc = "0.2.180"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"

[[bin]]
name = "trevrpc-bench"
path = "src/main.rs"

[[bin]]
name = "trevrpc-conformance"
path = "src/bin/trevrpc-conformance.rs"
