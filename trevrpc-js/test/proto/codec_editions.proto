// An editions file: protoc-gen-trevrpc-js leaves its messages to protobuf-es, which handles field
// presence, defaults, closed enums and the delimited encoding.
edition = "2023";

package codec.v1.editions;

enum Closed {
  option features.enum_type = CLOSED;

  CLOSED_ZERO = 0;
  CLOSED_ONE = 1;
}

message Legacy {
  int32 count = 1 [default = 7];
  string name = 2;
  Closed closed = 3;
  Legacy child = 4 [features.message_encoding = DELIMITED];
  int32 required = 5 [features.field_presence = LEGACY_REQUIRED];
  repeated int32 values = 6;
}
