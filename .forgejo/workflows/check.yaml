name: check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  check:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    # A backstop: max-silent-time below catches a hung build first. A full rebuild without the
    # binary cache takes well under an hour.
    timeout-minutes: 60
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@e282901cae32c9c45568095f851a7e56d0cbf46d # v1.78.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      # max-silent-time fails a build that prints nothing for 15 minutes, such as a deadlocked
      # test, instead of letting the job run until it is cancelled. log-lines leaves room for the
      # goroutine dump a Go test logs when its listener does not shut down.
      - name: Check
        run: nix flake check --option log-lines 1000 --option max-silent-time 900
