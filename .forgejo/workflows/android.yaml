name: android

# The emulator and browser runs are the slowest and most expensive jobs, so they run weekly and on
# demand rather than on every push.
on:
  schedule:
    - cron: "0 10 * * 0" # every Sunday at 10:00 UTC
  workflow_dispatch:

# A manual run waits for a run already in progress.
concurrency:
  group: ${{ github.workflow }}

# yaml-language-server-disable is not allowed
enable-openid-connect: true

# Each server's run is a call to android-interop.yaml. The rust run starts after the go run, pass or
# fail, so the runner holds one emulator at a time: two on a shared runner slowed boots and calls
# past their timeouts.
jobs:
  go:
    # zizmor: ignore[excessive-permissions]
    # Forgejo takes a local path here, not GitHub's `$/` syntax.
    uses: ./.forgejo/workflows/android-interop.yaml # zizmor: ignore[self-repository]
    with:
      server: go
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  rust:
    # zizmor: ignore[excessive-permissions]
    needs: go
    if: ${{ !cancelled() }}
    # Forgejo takes a local path here, not GitHub's `$/` syntax.
    uses: ./.forgejo/workflows/android-interop.yaml # zizmor: ignore[self-repository]
    with:
      server: rust
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
