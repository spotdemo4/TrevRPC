name: android

# The emulator and browser runs are the slowest and most expensive jobs, so they run weekly and on
# demand rather than on every push.
on:
  schedule:
    - cron: "0 10 * * 0" # every Sunday at 10:00 UTC
  workflow_dispatch:

# A manual run waits for a run already in progress.
concurrency:
  group: ${{ github.workflow }}

# yaml-language-server-disable is not allowed
enable-openid-connect: true

# The harness steps are in .forgejo/actions/android-interop, which each job runs for its server.
jobs:
  android-to-go:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CELL: android-to-go
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f8bfbfa0bb30e4367eda405d1c9d28344454b114 # v1.81.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: android

      - name: Run Android interop
        # Forgejo takes a local path here, not GitHub's `$/` syntax.
        uses: ./.forgejo/actions/android-interop # zizmor: ignore[self-repository]
        with:
          server: go
          output: ${{ runner.temp }}/${{ env.CELL }}

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: ${{ env.CELL }}
          path: ${{ runner.temp }}/${{ env.CELL }}
          if-no-files-found: ignore

  android-to-rust:
    # zizmor: ignore[excessive-permissions]
    # Runs after the go job, pass or fail, so the runner holds one emulator at a time: two on a
    # shared runner slowed boots and calls past their timeouts.
    needs: android-to-go
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CELL: android-to-rust
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@f8bfbfa0bb30e4367eda405d1c9d28344454b114 # v1.81.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: android

      - name: Run Android interop
        # Forgejo takes a local path here, not GitHub's `$/` syntax.
        uses: ./.forgejo/actions/android-interop # zizmor: ignore[self-repository]
        with:
          server: rust
          output: ${{ runner.temp }}/${{ env.CELL }}

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: ${{ env.CELL }}
          path: ${{ runner.temp }}/${{ env.CELL }}
          if-no-files-found: ignore
