name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  actions:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      # zizmor's online audits read Forgejo's URL-form action references
      # (https://host/owner/repo@ref) as a GitHub repository named "https:/"
      # and abort, so files with one are left to the offline audits in the
      # actions-fj flake checks.
      - name: Run zizmor
        run: zizmor $(find .forgejo/workflows .forgejo/actions -name "*.yaml" -exec grep -LE "uses:\s*['\"]?https?://" {} +)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  nix:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  go:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run govulncheck
        working-directory: trevrpc-go
        run: govulncheck ./...

      - name: Run govulncheck on the QMux module
        working-directory: trevrpc-go/qmux
        run: govulncheck ./...

      - name: Run govulncheck on the OpenTelemetry module
        working-directory: trevrpc-go/oteltrevrpc
        run: govulncheck ./...

      - name: Run govulncheck on the protovalidate module
        working-directory: trevrpc-go/protovalidatetrevrpc
        run: govulncheck ./...

  kotlin:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run OSV-Scanner
        run: .forgejo/scripts/osv-scan-kotlin.sh

  npm:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run npm audit
        working-directory: trevrpc-js
        run: npm audit --audit-level moderate --omit=dev

      - name: Run npm audit on the Effect adapter
        working-directory: trevrpc-js/effect
        run: npm audit --audit-level moderate --omit=dev

      - name: Run npm audit on the protovalidate adapter
        working-directory: trevrpc-js/protovalidate
        run: npm audit --audit-level moderate --omit=dev

      - name: Run npm audit on the protoc plugin
        working-directory: trevrpc-js/protoc-gen-trevrpc-js
        run: npm audit --audit-level moderate --omit=dev

  python:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run uv audit
        working-directory: trevrpc-py
        run: uv audit --frozen --no-dev --preview-features audit-command

      - name: Run uv audit on the protoc plugin
        working-directory: trevrpc-py/protoc-gen-trevrpc-py
        run: uv audit --frozen --no-dev --preview-features audit-command

  rust:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run cargo audit
        working-directory: trevrpc-rust
        run: cargo-audit audit

      - name: Run cargo audit on the JavaScript zstd module
        working-directory: trevrpc-js/zstd-wasm
        run: cargo-audit audit
