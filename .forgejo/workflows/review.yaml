name: review

on:
  pull_request:
    # CODEOWNERS requests pi's review when a pull request opens. Pushes make
    # pi's approval stale; re-request pi's review when the pull request is
    # ready again.
    types: [review_requested]

# Queue pi's reviews of the same pull request so re-requests don't overlap.
# Key on the reviewer so skipped runs for other reviewers can't cancel a
# queued review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.requested_reviewer.login }}

jobs:
  review:
    # zizmor: ignore[excessive-permissions]
    if: github.event.requested_reviewer.login == 'pi'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The wiki diff needs the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false

      # Without a shell, pi can't diff the wiki submodule itself. Write the diff
      # inside .git, where pi can read it but pi-action won't commit it. A diff
      # that fails, such as for a wiki commit that can't be fetched, becomes a
      # note for pi to report instead of failing the run before pi can comment.
      - name: Diff wiki
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! {
            base=$(git merge-base "origin/$BASE_REF" HEAD) &&
              git submodule update --init wiki &&
              git diff --submodule=diff --no-color --no-ext-diff --no-textconv "$base" HEAD -- wiki >.git/wiki.diff
          }; then
            echo "The wiki changes could not be diffed; the wiki commit $(git rev-parse HEAD:wiki) may not be pushed to the wiki's main branch." >.git/wiki.diff
          fi

      - name: Review pull request
        uses: trev-zip/pi-action@710274d3492c95042fa6da2f5b162212312d26c7 # v0.6.0
        with:
          token: ${{ secrets.PI_TOKEN }}
          base-url: ${{ secrets.PI_ACTION_BASE_URL }}
          api: anthropic-messages
          api-key: ${{ secrets.PI_ACTION_API_KEY }}
          model: claude-sonnet-5-5
          thinking: medium
          exclude-tools: bash,edit,write
          review: approve
          reapprove-unchanged: true
          prompt: .forgejo/prompts/review.md
