name: release

# Only the unscoped tag: flake-release releases each package to its own tag on the same commit, so
# triggering on the package tags too would release everything twice.
on:
  push:
    tags: ["v*"]

# Every bump releases the root, which is in bumper.toml's version group, so each one has a base tag.
# flake-release releases each package tagged on its commit to its own tag, picked by source
# directory, including the libraries whose versions differ from the base tag. A shared group would
# cancel queued versions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# yaml-language-server-disable is not allowed
enable-openid-connect: true

# flake-release publishes each package after the packages it depends on (go.mod requires, npm peer
# dependencies, Cargo dependencies) and skips it if one of them fails.
jobs:
  erlang:
    # zizmor: ignore[excessive-permissions]
    name: trevrpc-erlang
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      # Both sources have rebar.config and gleam.toml. trevrpc's Gleam modules make flake-release
      # publish it with gleam publish, which ships the Gleam binding alongside the runtime; qmux,
      # without any, is published with rebar3. trevrpc's path dependency on qmux becomes a Hex
      # requirement on the version this run publishes, with qmux going out first, or, when qmux
      # didn't change, on the version it is already released at.
      - name: Release to Forgejo and hex.pm
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          HEXPM_TOKEN: ${{ secrets.HEXPM_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: |
            packages.x86_64-linux.trevrpc-erlang-qmux
            packages.x86_64-linux.trevrpc-erlang

  go:
    # zizmor: ignore[excessive-permissions]
    name: trevrpc-go
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo and pkg.go.dev
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          PKG_GO_DEV_PUBLISHING: true
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: |
            packages.x86_64-linux.trevrpc-go
            packages.x86_64-linux.trevrpc-go-qmux
            packages.x86_64-linux.trevrpc-go-otel
            packages.x86_64-linux.trevrpc-go-protovalidate

  js:
    # zizmor: ignore[excessive-permissions]
    name: trevrpc-js
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo and npm
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPM_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          # @trevrpc/qmux goes first: @trevrpc/trevrpc-js depends on it.
          PACKAGES: |
            packages.x86_64-linux.trevrpc-js-qmux
            packages.x86_64-linux.trevrpc-js
            packages.x86_64-linux.trevrpc-js-effect
            packages.x86_64-linux.trevrpc-js-protovalidate
            packages.x86_64-linux.trevrpc-js.protocGen

  kotlin:
    # zizmor: ignore[excessive-permissions]
    name: trevrpc-kotlin
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo and Maven Central
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_SIGNING_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-kotlin

  python:
    # zizmor: ignore[excessive-permissions]
    name: trevrpc-py
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      # flake-release builds each package's sdist and wheel with uv from the package's source, as
      # the trevrpc-py-release check does, and publishes them. Without PYPI_TOKEN it publishes to the
      # Forgejo registry only. The interop client is not released.
      - name: Release to Forgejo and pypi.org
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: |
            packages.x86_64-linux.trevrpc-py
            packages.x86_64-linux.trevrpc-py.protocGen

  rust:
    # zizmor: ignore[excessive-permissions]
    name: trevrpc-rust
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo and crates.io
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: |
            packages.x86_64-linux.trevrpc-rust
            packages.x86_64-linux.trevrpc-rust-otel
            packages.x86_64-linux.trevrpc-rust-protovalidate

  buf:
    # zizmor: ignore[excessive-permissions]
    name: buf.build/trevrpc/trevrpc
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@de735751eb768b127a25bde1a8b776e3d3b0ec70 # v1.82.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: release

      # Labels the module with the version and moves main, the default label unpinned deps
      # resolve, to it; an unchanged module reuses its existing commit. buf's --git-metadata would
      # derive the labels and source link, but it only knows GitHub, GitLab, and Bitbucket remotes.
      - name: Release to the Buf Schema Registry
        working-directory: proto
        run: buf push --label "$VERSION" --label main --source-control-url "$SOURCE_URL"
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
