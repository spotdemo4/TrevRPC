name: release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  check:
    # zizmor: ignore[excessive-permissions]
    if: >-
      startsWith(github.ref, 'refs/tags/trevrpc-go/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-js/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-kotlin/v') ||
      startsWith(github.ref, 'refs/tags/trevrpc-rust/v')
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      - name: Check
        run: nix flake check

  go:
    # zizmor: ignore[excessive-permissions]
    needs: check
    if: startsWith(github.ref, 'refs/tags/trevrpc-go/v')
    name: trevrpc-go
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-go

      - name: Seed proxy.golang.org and pkg.go.dev
        run: .forgejo/scripts/release-go-module.sh

  js:
    # zizmor: ignore[excessive-permissions]
    needs: check
    if: startsWith(github.ref, 'refs/tags/trevrpc-js/v')
    name: trevrpc-js
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo and npm
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPM_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-js

  kotlin:
    # zizmor: ignore[excessive-permissions]
    needs: check
    if: startsWith(github.ref, 'refs/tags/trevrpc-kotlin/v')
    name: trevrpc-kotlin
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo and Maven Central
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_SIGNING_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-kotlin

  rust:
    # zizmor: ignore[excessive-permissions]
    needs: check
    if: startsWith(github.ref, 'refs/tags/trevrpc-rust/v')
    name: trevrpc-rust
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo and crates.io
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: packages.x86_64-linux.trevrpc-rust
