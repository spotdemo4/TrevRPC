name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  check:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      - name: Verify versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag"
          test "$(jq -r .version trevrpc-js/package.json)" = "$tag"
          test "$(jq -r .version trevrpc-js/npm/native-linux-x64-gnu/package.json)" = "$tag"
          test "$(grep '^version =' trevrpc-rust/Cargo.toml | head -1 | cut -d'"' -f2)" = "$tag"
          test "$(grep 'version =' trevrpc-js/default.nix | head -1 | grep -o '[0-9.]\+')" = "$tag"
          test "$(grep 'version =' trevrpc-js/native-package.nix | head -1 | grep -o '[0-9.]\+')" = "$tag"
          test "$(grep 'version =' trevrpc-kotlin/build.gradle.kts | head -1 | grep -o '[0-9.]\+')" = "$tag"
          test "$(grep 'version =' trevrpc-kotlin/default.nix | head -1 | grep -o '[0-9.]\+')" = "$tag"

      - name: Check
        run: nix flake check

  forgejo:
    # zizmor: ignore[excessive-permissions]
    needs: check
    name: forgejo
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: release
          token: ${{ secrets.DOCTOR_TOKEN }}
          fetch_depth: 0

      - name: Release to Forgejo
        env:
          GITHUB_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          REGISTRY: trev.zip
          REGISTRY_PASSWORD: ${{ secrets.PACKAGE_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: true
          PACKAGES: |
            packages.x86_64-linux.trevrpc-go.x86_64-unknown-linux-musl
            packages.x86_64-linux.trevrpc-rust.x86_64-unknown-linux-musl
        run: flake-release

  crates:
    # zizmor: ignore[excessive-permissions]
    needs: check
    name: crates.io
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: release

      - name: Release to crates.io
        working-directory: trevrpc-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing]
          # Bumper only bumps `trevrpc` in Cargo.lock; workspace members keep
          # their old version until Cargo regenerates the lockfile. Ensure the
          # lockfile matches all Cargo.toml versions before publishing.
          cargo update --workspace
          cargo publish --locked --allow-dirty

  npm:
    # zizmor: ignore[excessive-permissions]
    needs: check
    name: npm
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: release

      - name: Build npm stage
        run: |
          set -euo pipefail
          stage="$(nix build .#trevrpc-js-npm-stage --no-link --print-out-paths)"
          echo "stage=$stage"
          ls -lh "$stage"/*.tgz
          cat "$stage"/manifest.json
          echo "stage=$stage" >> "$GITHUB_ENV"

      - name: Release to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing]
          set -euo pipefail
          cat "${stage}/manifest.json"
          native_tgz="$(ls "${stage}"/trevrpc-trevrpc-js-native-linux-x64-gnu-*.tgz)"
          core_tgz="$(ls "${stage}"/trevrpc-trevrpc-js-*.tgz | grep -v native)"
          echo "native: $native_tgz"
          echo "core: $core_tgz"
          test -f "$native_tgz"
          test -f "$core_tgz"
          # NODE_AUTH_TOKEN alone is not sufficient; npm reads auth from .npmrc.
          # `nix-init` does not configure npm auth like `actions/setup-node` does.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          # Forgejo's OIDC issuer (trev.zip) is not trusted by registry.npmjs.org
          # Sigstore/Fulcio, so provenance must be disabled. NPM_CONFIG_PROVENANCE
          # is insufficient: publishConfig.provenance=true in the packed tarball
          # overrides env vars via @npmcli/config flatten (only CLI flags win).
          # Use --provenance=false explicitly and clear any Forgejo-issued tokens.
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN NPM_ID_TOKEN SIGSTORE_ID_TOKEN || true
          npm publish --provenance=false --access public "$native_tgz"
          npm publish --provenance=false --access public "$core_tgz"

  maven:
    # zizmor: ignore[excessive-permissions]
    needs: check
    name: maven central
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: release

      - name: Stage Kotlin Maven repository
        working-directory: trevrpc-kotlin
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew stageMavenRepository --no-configuration-cache

      - name: Verify Kotlin staging repository
        working-directory: trevrpc-kotlin
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          python3 publication-tests/verify_staged_repository.py build/staging-repository "$tag"

      - name: Publish Kotlin to Maven Central
        working-directory: trevrpc-kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          bundle="build/central-bundle.zip"
          rm -f "$bundle"
          (cd build/staging-repository && zip -r "../central-bundle.zip" .)
          echo "bundle: $bundle"
          ls -lh "$bundle"
          unzip -l "$bundle" | head -n 100
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body --show-error \
            -H "Authorization: Bearer $token" \
            -F bundle=@"$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=trevrpc-kotlin-$tag"
          echo "Bundle trevrpc-kotlin-$tag uploaded with AUTOMATIC publishing"

  pkg:
    # zizmor: ignore[excessive-permissions]
    needs: check
    name: pkg.go.dev
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0

      - name: Seed proxy.golang.org
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag ref=$GITHUB_REF"
          commit="$(git rev-parse HEAD)"
          short="${commit:0:12}"
          echo "commit=$commit short=$short"

          fetch() {
            url="$1"
            echo "GET $url"
            curl --fail --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url"
          }

          fetch "https://proxy.golang.org/trev.zip/llc/trevrpc/@v/${tag}.info"
          fetch "https://proxy.golang.org/trev.zip/llc/trevrpc/@v/${tag}.mod"
          # trevrpc-go is a sub-directory module (trev.zip/llc/trevrpc/trevrpc-go);
          # bare v* tags do not produce a stable version for it, so seed the
          # pseudo-version for this commit. Anubis allows Go-http-client/1.1,
          # so proxy.golang.org can fetch from trev.zip.
          fetch "https://proxy.golang.org/trev.zip/llc/trevrpc/trevrpc-go/@v/${commit}.info"
          fetch "https://proxy.golang.org/trev.zip/llc/trevrpc/trevrpc-go/@v/${short}.info"
          fetch "https://proxy.golang.org/trev.zip/llc/trevrpc/trevrpc-go/@v/${commit}.mod" || true
          # Warm sumdb (best-effort)
          curl --fail --show-error --retry 3 --retry-delay 2 --retry-all-errors "https://sum.golang.org/lookup/trev.zip/llc/trevrpc@${tag}" || true

          echo "Done. index.golang.org will be updated within minutes; pkg.go.dev follows (see https://pkg.go.dev/about#adding-a-package)."
