name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  linux:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@3111d9c56193a4983beca8b41a2e0835678abcaa # v1.63.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          token: ${{ secrets.DOCTOR_TOKEN }}
          fetch_depth: 0
          shell: release

      - name: Release to Forgejo
        env:
          GITHUB_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          REGISTRY: trev.zip
          REGISTRY_PASSWORD: ${{ secrets.PACKAGE_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: true
          PACKAGES: |
            packages.x86_64-linux.trevrpc-go.x86_64-unknown-linux-musl
            packages.x86_64-linux.trevrpc-rust.x86_64-unknown-linux-musl
        run: flake-release

      - name: Release to Cargo
        working-directory: trevrpc-rust
        env:
          CARGO_REGISTRIES_FORGEJO_INDEX: sparse+${{ forgejo.SERVER_URL }}/api/packages/${{ forgejo.REPOSITORY_OWNER }}/cargo/
          CARGO_REGISTRIES_FORGEJO_TOKEN: Bearer ${{ secrets.PACKAGE_TOKEN }}
        run: cargo publish --registry forgejo --locked # zizmor: ignore[use-trusted-publishing]

      - name: Release to proxy
        working-directory: trevrpc-go
        env:
          FORGEJO_GO_UPLOAD_URL: ${{ forgejo.SERVER_URL }}/api/packages/${{ forgejo.REPOSITORY_OWNER }}/go/upload
          FORGEJO_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          set -euo pipefail

          module="$(go list -m)"
          version="${GITHUB_REF_NAME}"
          cache="$(mktemp -d)"
          metadata="${cache}/module.json"

          GOMODCACHE="${cache}/mod" \
            GONOSUMDB="${module}" \
            GOPRIVATE="${module}" \
            GOPROXY=direct \
            go mod download -json "${module}@${version}" > "${metadata}"

          archive="$(jq -r .Zip "${metadata}")"
          test -n "${archive}"
          test "${archive}" != "null"

          curl --fail-with-body \
            --request PUT \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --upload-file "${archive}" \
            "${FORGEJO_GO_UPLOAD_URL}"
