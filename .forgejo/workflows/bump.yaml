name: bump

on:
  schedule:
    - cron: "0 22 * * 1-5" # every weekday at 22:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "force"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

# yaml-language-server-disable is not allowed
enable-openid-connect: true

concurrency:
  group: bump

jobs:
  bump:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@65167e71611029bf1f64e4dd6492de35ab553ae2 # v1.66.2
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: bump

      - name: Bump, validate, and push
        env:
          GITHUB_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: .forgejo/scripts/bump.sh
