name: buf

on:
  push:
    branches: ["main"]
    paths: ["proto/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  push:
    # zizmor: ignore[excessive-permissions]
    name: buf.build/trevrpc/trevrpc
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a09ea83c7aa7f99a6832771f7b7cb3a764ade52f # v1.71.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: release

      # Labels the commit with the branch and any tags on it, and links it to
      # the source commit.
      - name: Push to the Buf Schema Registry
        working-directory: proto
        run: buf push --git-metadata --create --create-visibility public
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
