name: buf

on:
  push:
    branches: ["main"]
    paths: ["proto/**", ".forgejo/workflows/buf.yaml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  push:
    # zizmor: ignore[excessive-permissions]
    name: buf.build/trevrpc/trevrpc
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@1501959c395e5bc6d66e87c7b84d1816c1b365bd # v1.73.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: release

      # Labels the commit with its branch and links it to the source commit.
      # buf's --git-metadata would derive these, but it only knows GitHub,
      # GitLab, and Bitbucket remotes.
      - name: Push to the Buf Schema Registry
        working-directory: proto
        run: >-
          buf push --create --create-visibility public --create-default-label main
          --label "$LABEL" --source-control-url "$SOURCE_URL"
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          LABEL: ${{ github.ref_name }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
