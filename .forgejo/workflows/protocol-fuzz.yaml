name: protocol-fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  protocol-fuzz:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@a381c8e0765c98cb84fdc4a392eefd6c4db309a5 # v1.57.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      - name: Run bounded Go fuzz targets
        run: |
          nix develop -c bash -euxo pipefail -c 'cd trevrpc-go && go test ./... -run=^$ -fuzz=FuzzFrameDecodeNeverPanics -fuzztime=60s'
          nix develop -c bash -euxo pipefail -c 'cd trevrpc-go && go test ./... -run=^$ -fuzz=FuzzFrameLengthParsing -fuzztime=60s'
          nix develop -c bash -euxo pipefail -c 'cd trevrpc-go && go test ./... -run=^$ -fuzz=FuzzMetadataValidationDeterministic -fuzztime=60s'
