name: webtransport-matrix

on:
  workflow_dispatch:
    inputs:
      include_non_chromium:
        description: Run manual Firefox/WebKit WebTransport diagnostics
        required: false
        default: "false"
  schedule:
    - cron: "41 5 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  webtransport-soak:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@1443d93dfa3ca2f043b37f848631d6ac5563b0ec # v1.56.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      - name: Run Chromium WebTransport soak
        run: nix run .#browser-webtransport-soak
        env:
          TREVRPC_BROWSER: chromium
          TREVRPC_BROWSER_SOAK_ITERATIONS: "20"
          TREVRPC_BROWSER_SOAK_TIMEOUT_MS: "5400000"

  cross-runtime-lifecycle-stress:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@1443d93dfa3ca2f043b37f848631d6ac5563b0ec # v1.56.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      - name: Run Go/Rust lifecycle stress
        run: nix run .#cross-runtime-lifecycle-stress
        env:
          TREVRPC_XRUNTIME_LIFECYCLE_ITERATIONS: "50"

  non-chromium-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_non_chromium == 'true' }}
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@1443d93dfa3ca2f043b37f848631d6ac5563b0ec # v1.56.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      - name: Run manual non-Chromium WebTransport diagnostic
        run: nix develop -c bash -c 'npm --prefix trevrpc-js ci && npm --prefix trevrpc-js run test:browser'
        env:
          TREVRPC_BROWSER: ${{ matrix.browser }}
          TREVRPC_BROWSER_ALLOW_UNSTABLE: "1"
