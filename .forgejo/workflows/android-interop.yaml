name: android-interop

# One server's Android interop, over HTTP/3 and then HTTP/2, which the android workflow calls once
# per server.
on:
  workflow_call:
    inputs:
      server:
        description: The interop server to run the scenarios against (go or rust)
        required: true
        type: string
    # Forgejo rejects a `secrets` key here; the caller passes GH_TOKEN through `jobs.<id>.secrets`.

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  interop:
    # zizmor: ignore[excessive-permissions]
    name: android-to-${{ inputs.server }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      SERVER: ${{ inputs.server }}
      CELL: android-to-${{ inputs.server }}
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@058efbda6393adccb321793a01b3fe4ea0533885 # v1.80.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: android

      - name: Run Android interop over HTTP/3
        env:
          TRANSPORT: http3
          OUTPUT: ${{ runner.temp }}/${{ env.CELL }}/http3
          WORK_DIR: ${{ runner.temp }}/android-work/http3
        run: |
          trevrpc-interop-android \
            --server-command "trevrpc-interop-$SERVER" \
            --transport "$TRANSPORT" \
            --output "$OUTPUT" \
            --work-dir "$WORK_DIR"

      # Runs with QUIC disabled, as on a network that blocks UDP, even if the HTTP/3 run failed.
      - name: Run Android interop over HTTP/2
        if: ${{ !cancelled() }}
        env:
          TRANSPORT: http2
          OUTPUT: ${{ runner.temp }}/${{ env.CELL }}/http2
          WORK_DIR: ${{ runner.temp }}/android-work/http2
        run: |
          trevrpc-interop-android \
            --server-command "trevrpc-interop-$SERVER" \
            --transport "$TRANSPORT" \
            --output "$OUTPUT" \
            --work-dir "$WORK_DIR"

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: ${{ env.CELL }}
          path: ${{ runner.temp }}/${{ env.CELL }}
          if-no-files-found: ignore
