[versions]
android-gradle = "9.4.1"
android-test = "1.7.0"
android-test-junit = "1.3.0"
coroutines = "1.11.0"
cronet = "500.1.0"
dokka = "2.2.0"
junit = "6.1.3"
kotlin = "2.4.21"
protobuf = "4.36.2"

[libraries]
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
cronet-bundled = { module = "org.chromium.net:cronet-bundled", version.ref = "cronet" }
cronet-library = { module = "org.chromium.net:cronet", version.ref = "cronet" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
