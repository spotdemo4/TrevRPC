org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=false
org.gradle.parallel=true
# Gradle's default 512 MiB heap runs out when one build resolves every module and shrinks the Android
# interop app with R8, as the dependency update does. Setting the heap replaces Gradle's default
# metaspace limit as well, so it is set again.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official
kotlin.incremental=true
