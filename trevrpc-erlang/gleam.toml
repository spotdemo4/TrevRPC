# Lets Gleam build this rebar3 application from its sources, so that
# trevrpc-gleam can depend on it by path. rebar.config, rebar.lock and
# src/trevrpc.app.src stay the source of truth: the trevrpc-gleam-versions
# check (trevrpc-gleam/check-versions.py) keeps the version and dependencies
# here in step with them.
name = "trevrpc"
version = "1.11.1"
description = "Erlang runtime for TrevRPC"
licences = ["MIT"]
target = "erlang"

[repository]
type = "forgejo"
host = "https://trev.zip"
user = "llc"
repo = "TrevRPC"

[dependencies]
quic = ">= 3.1.0 and < 3.2.0"
h2 = ">= 0.18.0 and < 0.19.0"
erlang_h1 = ">= 0.11.0 and < 0.12.0"
erlang_ws = ">= 0.5.0 and < 0.6.0"

[erlang]
extra_applications = ["crypto", "public_key", "ssl"]
