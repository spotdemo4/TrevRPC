# The one Hex package for Erlang and Gleam: gleam publish ships the runtime's
# Erlang modules, the Gleam binding in src/trevrpc/, and the Erlang that Gleam
# compiles it to, so rebar3 and mix build the package without Gleam.
# rebar.config, rebar.lock and src/trevrpc.app.src stay the source of truth
# for the runtime: the trevrpc-erlang-versions check (check-versions.py) keeps
# the version, description and dependencies here and in manifest.toml in step
# with them.
name = "trevrpc"
version = "1.11.1"
description = "Protobuf over QUIC, HTTP/3 & WebTransport"
licences = ["MIT"]
target = "erlang"

[repository]
type = "forgejo"
host = "https://trev.zip"
user = "llc"
repo = "TrevRPC"

[dependencies]
quic = ">= 3.1.0 and < 3.2.0"
h2 = ">= 0.18.0 and < 0.19.0"
erlang_h1 = ">= 0.11.0 and < 0.12.0"
erlang_ws = ">= 0.5.0 and < 0.6.0"
# The Gleam binding's Option, Dict and List. The runtime's own modules do not
# use it, so rebar.config leaves it out.
gleam_stdlib = ">= 0.44.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[erlang]
extra_applications = ["crypto", "public_key", "ssl"]
